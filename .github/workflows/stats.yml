name: Update GitHub stats
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GitHub Stats
        run: python -m pip install 'git+https://github.com/tiagovla/stats.github.git'
      - name: Generate SVGs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python -m github_stats --username "$OWNER" --output /tmp/github-stats-dark --theme github-dark
          python -m github_stats --username "$OWNER" --output generated --theme github-light
          for name in stats languages activity; do
            cp "/tmp/github-stats-dark/$name.svg" "generated/$name-dark.svg"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: generated
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
